services:
  harness-postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: cc_harness
      POSTGRES_USER: cc_harness
      POSTGRES_PASSWORD: cc_harness
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - cc-harness-postgres-data:/var/lib/postgresql/data

  harness-redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "63879:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - cc-harness-redis-data:/data

volumes:
  cc-harness-postgres-data:
  cc-harness-redis-data:
