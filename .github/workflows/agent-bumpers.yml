name: Agent Bumpers

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run dependency preflight
        run: bun run verify:deps

      - name: Run CI build trust gate
        run: bun run verify:ci

      - name: Run release build trust gate
        if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')
        run: bun run verify:release

      - name: Upload proof artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-trust-proof
          path: |
            build-trust-proof.html
            build-trust-artifacts/**
            coverage/**
