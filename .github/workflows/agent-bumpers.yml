name: Agent Bumpers

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run repo bumpers
        run: bun run test:repo

      - name: Run build pipeline
        run: bun run pipeline

      - name: Build HTML proof
        run: bun run test:quality:proof

      - name: Upload proof artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-quality-proof
          path: test-quality-proof.html

  docker-build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build always loads locally so the smoke step can curl /health.
      # On push-to-main we additionally push to GHCR so deploy targets
      # have a pullable image. PRs from forks skip the push (the
      # GITHUB_TOKEN on fork PRs lacks packages:write), which is why the
      # login + push steps are gated on `github.event_name != 'pull_request'`.
      - name: Compute image tags
        id: tags
        run: |
          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          SHORT_SHA="${GITHUB_SHA::7}"
          {
            echo "ghcr_image=ghcr.io/${OWNER_LC}/cc-rebuilt"
            echo "short_sha=${SHORT_SHA}"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (PR, load only)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: cc-rebuilt:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Only GHCR-qualified tags belong in `tags:` here. An unqualified
      # `cc-rebuilt:ci` resolves to docker.io/library/cc-rebuilt:ci and buildx
      # tries to push it to Docker Hub (401 Unauthorized). The local tag used
      # by the smoke step below is re-added via `docker tag` after the push.
      - name: Build + push image (main)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          load: true
          tags: |
            ${{ steps.tags.outputs.ghcr_image }}:sha-${{ steps.tags.outputs.short_sha }}
            ${{ steps.tags.outputs.ghcr_image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Retag loaded image for smoke probe (main)
        if: github.event_name != 'pull_request'
        run: docker tag ${{ steps.tags.outputs.ghcr_image }}:latest cc-rebuilt:ci

      - name: Smoke — container /health
        run: |
          docker run -d --name cc-daemon -p 8181:8181 cc-rebuilt:ci
          for i in {1..20}; do
            if curl -sf http://127.0.0.1:8181/health > /dev/null; then
              echo "daemon healthy after $i probes"
              curl -s http://127.0.0.1:8181/health | head -c 2000
              exit 0
            fi
            sleep 1
          done
          echo "daemon did not become healthy" >&2
          docker logs cc-daemon || true
          exit 1

      - name: Teardown container
        if: always()
        run: docker rm -f cc-daemon || true
