name: Agent Bumpers

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run repo bumpers
        run: bun run test:repo

      - name: Run build pipeline
        run: bun run pipeline

      - name: Build HTML proof
        run: bun run test:quality:proof

      - name: Upload proof artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-quality-proof
          path: test-quality-proof.html
